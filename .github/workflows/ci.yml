name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, zip, mbstring, xml
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - run: cp .env.testing .env

      - run: php artisan key:generate

      - run: php artisan test --env=testing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: sauwin/FE_NTI
          path: fe_nti

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fe_nti/package-lock.json

      - run: npm ci
        working-directory: fe_nti

      - run: npx vue-tsc --noEmit
        working-directory: fe_nti

      - run: npm run build
        working-directory: fe_nti

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: sauwin/FE_NTI
          path: fe_nti

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, zip, mbstring, xml
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-dev --no-interaction --prefer-dist
      - run: cp .env.testing .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan serve --port=8000 &

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fe_nti/package-lock.json

      - run: npm ci
        working-directory: fe_nti

      - run: npx playwright install webkit --with-deps
        working-directory: fe_nti

      - run: npx playwright test
        working-directory: fe_nti
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: fe_nti/test-results/